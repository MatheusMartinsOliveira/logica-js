<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conta | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main>
        <label for="nota1">Valor da nota1:</label>
        <input type="number" id="nota1" step="0.01">
        <br><br>
        <label for="nota2">Valor da nota2:</label>
        <input type="number" id="nota2" min="1" step="0.01">

        <label for="nota3">Valor da nota3:</label>
        <input type="number" id="nota3" step="0.01">
        <button type="button" id="calcular">Calcular</button>
        <p id="resultado" class="resultado">O resultado aparece aqui.</p>
    </main>
    <script src="js/conta.js"></script>
</body>
</html>
