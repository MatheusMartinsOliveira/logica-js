<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viagem | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main>
        <label for="distancia">Distância da viagem (km):</label>
        <input type="number" id="distancia" step="0.01">
        <br><br>
        <label for="consumo">Consumo (km/l):</label>
        <input type="number" id="consumo" min="1" step="0.01">
        <br><br>
        <label for="preco">Preço do combustível (R$/l):</label>
        <input type="number" id="preco" step="0.01">
        <br><br>
        <button type="button" id="calcular">Calcular</button>
        <p id="resultado" class="resultado">O resultado aparece aqui.</p>
    </main>
    <script src="js/viagem.js"></script>
</body>
</html>
